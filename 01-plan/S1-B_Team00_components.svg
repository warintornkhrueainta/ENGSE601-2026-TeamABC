  <text x="20" y="450" font-size="15" font-weight="700" fill="#111827">ที่มาของภาพ: มีก่อนพัฒนา · วาดจาก CaseX HLD v0.9 (ตารางส่วนประกอบและตารางส่วนต่อประสาน I-01 ถึง I-03)</text>
