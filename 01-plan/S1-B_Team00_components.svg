<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Sarabun, 'IBM Plex Sans Thai', Loma, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <!-- layers -->
  <rect x="20" y="20" width="860" height="110" rx="10" fill="#eef4fb" stroke="#9fb6d3"/>
